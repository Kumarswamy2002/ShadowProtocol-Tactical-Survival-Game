name: Shadow Protocol CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet-build-and-test:
    name: .NET Core Engine & Game Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore ShadowProtocol.sln

      - name: Build Solution
        run: dotnet build ShadowProtocol.sln --no-restore --configuration Release

      - name: Execute Game Unit & Integration Tests
        run: dotnet test ShadowProtocol/Tests/ShadowProtocol.Tests.csproj --no-build --configuration Release --verbosity normal

  backend-tests:
    name: FastAPI Backend Pytest & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install flake8

      - name: Lint Code with Flake8
        run: |
          flake8 Backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Pytest Suite
        run: |
          cd Backend && pytest tests/ -v

  docker-validation:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Compose Stack
        run: |
          cd Docker && docker compose build
